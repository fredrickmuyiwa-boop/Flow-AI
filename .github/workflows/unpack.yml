name: Unpack project zip
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into the repo, keeping folders
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "No zip found"; exit 0; fi
          for z in "${zips[@]}"; do
            dest=$(mktemp -d)
            unzip -q -o "$z" -d "$dest"
            src="$dest"
            entries=( "$dest"/* )
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then src="${entries[0]}"; fi
            cp -r "$src"/. .
            git rm -q "$z"
          done
      - name: Commit the unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack FlowPilot AI source" || echo "Nothing to commit"
          git push
